name: Terraform destroy
'on':
  workflow_dispatch:
    inputs:
      image_tag:
        description: Current image full source SHA (Terraform input; no image is built)
        type: string
        required: true
      confirmation:
        description: Type DESTROY ecs-it-tools dev (deletes app, ECR images and logs)
        type: string
        required: true
      apply:
        description: Request approval to apply the saved destroy plan
        type: boolean
        default: false
permissions: {}
concurrency:
  group: terraform-application-dev
  cancel-in-progress: false
env:
  AWS_REGION: eu-west-2
  AWS_PAGER: ''
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_WORKSPACE: default
  TF_VAR_image_tag: ${{ inputs.image_tag }}
  PLAN_BUCKET: feras-ecs-it-tools-tfstate-670941257756
  DESTROY_CONFIRMATION: ${{ inputs.confirmation }}
jobs:
  plan:
    if: github.repository == 'Fer-as/ecs-v1-it-tools' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: dev
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      plan_key: ${{ steps.store.outputs.plan_key }}
      plan_version: ${{ steps.store.outputs.plan_version }}
      plan_sha256: ${{ steps.store.outputs.plan_sha256 }}
    defaults:
      run:
        shell: bash
    steps:
    - name: Check out workflow commit
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Validate explicit inputs
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        [[ "$TF_VAR_image_tag" =~ ^[0-9a-f]{40}$ ]]
        test "$DESTROY_CONFIRMATION" = "DESTROY ecs-it-tools dev"
    - name: Install Terraform
      uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
      with:
        terraform_version: 1.16.2
        terraform_wrapper: false
    - name: Authenticate planning role
      uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
      with:
        role-to-assume: arn:aws:iam::670941257756:role/ecs-it-tools-github-terraform-plan
        aws-region: eu-west-2
        audience: sts.amazonaws.com
        role-session-name: terraform-plan-${{ github.run_id }}
        role-duration-seconds: 1800
        unset-current-credentials: true
    - name: Verify planning identity
      run: |
        set -euo pipefail
        aws sts get-caller-identity --output json > "$RUNNER_TEMP/identity.json"
        jq -e --arg expected \
          "arn:aws:sts::670941257756:assumed-role/ecs-it-tools-github-terraform-plan/terraform-plan-$GITHUB_RUN_ID" \
          '.Account == "670941257756" and .Arn == $expected' \
          "$RUNNER_TEMP/identity.json"
        cat "$RUNNER_TEMP/identity.json"
    - name: Initialize and validate
      run: |
        set -euo pipefail
        terraform -chdir=terraform init -input=false -lockfile=readonly
        terraform -chdir=terraform fmt -recursive -check
        terraform -chdir=terraform validate
        test "$(terraform -chdir=terraform workspace show)" = "default"
        test ! -e terraform/validation-import.tf
        terraform -chdir=terraform state list
    - name: Inspect DNS before planning
      run: |
        set -euo pipefail
        aws route53 list-resource-record-sets \
          --hosted-zone-id Z01014153ETFBQT2QXXK2 \
          --output json
    - name: Create saved destroy plan
      run: |
        set -euo pipefail
        terraform -chdir=terraform plan \
          -destroy -input=false -no-color -lock-timeout=5m \
          -var-file=environments/dev/terraform.tfvars \
          -out=destroy.tfplan
        terraform -chdir=terraform show -no-color destroy.tfplan \
          > "$RUNNER_TEMP/destroy-plan.txt"
        terraform -chdir=terraform show -json destroy.tfplan \
          > "$RUNNER_TEMP/destroy-plan.json"
    - name: Check destroy scope
      run: |
        set -euo pipefail
        python3 scripts/check_destroy_plan.py "$RUNNER_TEMP/destroy-plan.json"
    - name: Store versioned plan privately
      id: store
      run: |
        set -euo pipefail
        plan_key="ecs-v1/dev/plans/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/destroy.tfplan"
        plan_sha256="$(sha256sum terraform/destroy.tfplan | cut -d ' ' -f 1)"

        aws s3api put-object \
          --bucket "$PLAN_BUCKET" \
          --key "$plan_key" \
          --body terraform/destroy.tfplan \
          --server-side-encryption AES256 \
          --output json > "$RUNNER_TEMP/plan-upload.json"

        plan_version="$(jq -er '.VersionId | select(. != "null" and . != "")' \
          "$RUNNER_TEMP/plan-upload.json")"

        aws s3api put-object \
          --bucket "$PLAN_BUCKET" \
          --key "ecs-v1/dev/plans/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/destroy-plan.txt" \
          --body "$RUNNER_TEMP/destroy-plan.txt" \
          --server-side-encryption AES256 > /dev/null

        {
          echo "plan_key=$plan_key"
          echo "plan_version=$plan_version"
          echo "plan_sha256=$plan_sha256"
        } >> "$GITHUB_OUTPUT"

        {
          echo "## Terraform destroy plan ready for review"
          echo
          echo "Operation: destroy"
          echo "Workflow commit: $GITHUB_SHA"
          echo "Terraform image input: $TF_VAR_image_tag"
          echo "Deletes application infrastructure, all ECR images, and application logs."
          echo "Backend storage, bootstrap resources, and hosted zone are excluded from the destroy scope."
          echo "Plan SHA256: $plan_sha256"
          echo "S3 key: $plan_key"
          echo "S3 version: $plan_version"
          echo
          echo "Review the Create saved destroy plan log before approving apply."
          echo "Binary plan is stored in private S3. Human-readable plan output and infrastructure metadata appear in this public repository's Actions logs."
        } >> "$GITHUB_STEP_SUMMARY"
  apply:
    needs: plan
    if: inputs.apply && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    environment: dev-terraform-apply
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      PLAN_KEY: ${{ needs.plan.outputs.plan_key }}
      PLAN_VERSION: ${{ needs.plan.outputs.plan_version }}
      PLAN_SHA256: ${{ needs.plan.outputs.plan_sha256 }}
    steps:
    - name: Check out same workflow commit
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Install same Terraform version
      uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
      with:
        terraform_version: 1.16.2
        terraform_wrapper: false
    - name: Authenticate approved apply role
      uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
      with:
        role-to-assume: arn:aws:iam::670941257756:role/ecs-it-tools-github-terraform
        aws-region: eu-west-2
        audience: sts.amazonaws.com
        role-session-name: terraform-apply-${{ github.run_id }}
        role-duration-seconds: 3600
        unset-current-credentials: true
    - name: Verify apply identity
      run: |
        set -euo pipefail
        aws sts get-caller-identity --output json > "$RUNNER_TEMP/identity.json"
        jq -e --arg expected \
          "arn:aws:sts::670941257756:assumed-role/ecs-it-tools-github-terraform/terraform-apply-$GITHUB_RUN_ID" \
          '.Account == "670941257756" and .Arn == $expected' \
          "$RUNNER_TEMP/identity.json"
        cat "$RUNNER_TEMP/identity.json"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
    - name: Retrieve exact approved plan version
      run: |
        set -euo pipefail
        [[ "$PLAN_KEY" =~ ^ecs-v1/dev/plans/${GITHUB_RUN_ID}/[1-9][0-9]*/destroy\.tfplan$ ]]
        [[ "$PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]]
        test -n "$PLAN_VERSION"
        test "$PLAN_VERSION" != "null"

        aws s3api get-object \
          --bucket "$PLAN_BUCKET" \
          --key "$PLAN_KEY" \
          --version-id "$PLAN_VERSION" \
          terraform/destroy.tfplan > /dev/null

        printf '%s  %s\n' "$PLAN_SHA256" terraform/destroy.tfplan |
          sha256sum --check
    - name: Initialize backend
      run: |
        set -euo pipefail
        terraform -chdir=terraform init -input=false -lockfile=readonly
        test "$(terraform -chdir=terraform workspace show)" = "default"
        test ! -e terraform/validation-import.tf
    - name: Recheck approved destroy scope and capture retained resources
      run: |
        set -euo pipefail
        test "$DESTROY_CONFIRMATION" = "DESTROY ecs-it-tools dev"
        [[ "$TF_VAR_image_tag" =~ ^[0-9a-f]{40}$ ]]
        terraform -chdir=terraform show -json destroy.tfplan \
          > "$RUNNER_TEMP/destroy-plan.json"
        python3 scripts/check_destroy_plan.py "$RUNNER_TEMP/destroy-plan.json"
        python3 scripts/verify_destroy_cleanup.py capture "$RUNNER_TEMP/destroy-baseline.json"
    - name: Apply approved destroy plan
      run: |
        set -euo pipefail
        terraform -chdir=terraform apply \
          -input=false -no-color -lock-timeout=5m \
          destroy.tfplan
    - name: Verify removal and retained resources
      run: |
        set -euo pipefail
        python3 scripts/verify_destroy_cleanup.py verify \
          "$RUNNER_TEMP/destroy-plan.json" "$RUNNER_TEMP/destroy-baseline.json"
    - name: Verify no remaining destroy actions
      run: |
        set -euo pipefail
        terraform -chdir=terraform plan \
          -destroy -input=false -no-color -lock-timeout=5m \
          -detailed-exitcode -var-file=environments/dev/terraform.tfvars
    - name: Record verified destroy
      run: |
        set -euo pipefail
        {
          echo "## Terraform destroy completed"
          echo
          echo "Workflow commit: $GITHUB_SHA"
          echo "Applied plan SHA256: $PLAN_SHA256"
          echo "Approved resource removal checks: PASS"
          echo "Managed application state empty: PASS"
          echo "Current state object retained with encryption and a non-null version ID: PASS"
          echo "Hosted zone and unrelated DNS records retained: PASS"
          echo "Post-destroy no-change destroy plan: PASS"
          echo "Task-definition revision history may remain INACTIVE."
          echo "Checks cover approved plan resources, not an account-wide orphan audit."
        } >> "$GITHUB_STEP_SUMMARY"
